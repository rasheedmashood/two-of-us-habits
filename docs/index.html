<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two of Us Habits</title>
<meta name="description" content="A shared habit tracker for two.">
<meta name="theme-color" content="#0c0b0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2eee9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Two of Us">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@85..100,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<script src="firebase-config.js"></script>
<style>
/* Layout: a board of widget tiles. Wide tiles (today rings, the two of you, shared habits) span the full width; personal habits sit in a 2-up grid of square tiles, each with its own color and its own chart style. Dark-first; a warm paper light theme follows the system, the host toggle, or the in-app Appearance switch (data-mode). */
:root{
  color-scheme:dark;
  --bg:#0c0b0d; --tile:#1a181c; --tile-2:#221f25; --rim:rgba(255,255,255,.06);
  --ink:#f5f2f0; --muted:#8f8a93; --faint:#4a464e; --track:#2c2830;
  --you:#a78bfa; --her:#60a5fa; --ok:#4ade80; --warn:#fb923c; --danger:#f87171;
  --cell:rgba(255,255,255,.065); --navbg:rgba(26,24,28,.82); --shadow:0 0 0 transparent; --navshadow:0 12px 30px -10px #000;
  --bead-hi:#3a3440; --bead-lo:#1c1a20; --jar-hi:#5a3a2a; --jar-lo:#2a1a14; --halo:rgba(255,255,255,.05); --scrim:rgba(0,0,0,.6); --icon-mix:0%;
  --display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:30px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]):not([data-mode="dark"]){
  color-scheme:light;
  --bg:#f2eee9; --tile:#ffffff; --tile-2:#fffdfb; --rim:rgba(60,40,20,.07);
  --ink:#1c181a; --muted:#7b737c; --faint:#b5aeb6; --track:#efeae5;
  --you:#7c3aed; --her:#2563eb; --ok:#16a34a; --warn:#ea580c; --danger:#dc2626;
  --cell:rgba(60,40,20,.065); --navbg:rgba(255,255,255,.86); --shadow:0 10px 26px -16px rgba(80,50,20,.28); --navshadow:0 12px 30px -12px rgba(80,50,20,.3);
  --bead-hi:#ece6e0; --bead-lo:#d4ccc4; --jar-hi:#eadfd5; --jar-lo:#cdbfb2; --halo:rgba(60,40,20,.05); --scrim:rgba(40,25,10,.32); --icon-mix:28%}}
:root[data-theme="light"]:not([data-mode="dark"]), :root[data-mode="light"]{
  color-scheme:light;
  --bg:#f2eee9; --tile:#ffffff; --tile-2:#fffdfb; --rim:rgba(60,40,20,.07);
  --ink:#1c181a; --muted:#7b737c; --faint:#b5aeb6; --track:#efeae5;
  --you:#7c3aed; --her:#2563eb; --ok:#16a34a; --warn:#ea580c; --danger:#dc2626;
  --cell:rgba(60,40,20,.065); --navbg:rgba(255,255,255,.86); --shadow:0 10px 26px -16px rgba(80,50,20,.28); --navshadow:0 12px 30px -12px rgba(80,50,20,.3);
  --bead-hi:#ece6e0; --bead-lo:#d4ccc4; --jar-hi:#eadfd5; --jar-lo:#cdbfb2; --halo:rgba(60,40,20,.05); --scrim:rgba(40,25,10,.32); --icon-mix:28%}
body{transition:background .4s ease,color .4s ease}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
/* sign-in and join screens */
.gate{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:40px}
.gate .mark{width:72px;height:72px;border-radius:22px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--rim);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:14px}
.gate .mark i{border-radius:4px;background:var(--track)}
.gate .mark i.on{background:linear-gradient(135deg,#e8742a,#fde047)}
.gate h1{font-family:var(--display);font-weight:500;font-size:clamp(32px,9vw,40px);line-height:1.05;letter-spacing:-.03em;margin:0;text-wrap:balance}
.gate h1 em{font-style:normal;color:var(--muted)}
.gate p{margin:0;color:var(--muted);line-height:1.5;max-width:34ch}
.gate .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;font-size:16px}
.gate .btn svg{width:20px;height:20px}
.gate .err{color:var(--danger);font-size:14px}
.gate .btn-row{flex-direction:column;align-items:stretch;max-width:340px}
.invite-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(120px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* top */
.top{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;overflow:hidden;background:var(--tile)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hi{min-width:0;flex:1}
.hi small{display:block;color:var(--muted);font-size:13px}
.hi b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--tile);display:grid;place-items:center;position:relative;color:var(--ink)}
.round svg{width:20px;height:20px}
.round .pip{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--tile)}
.headline{font-family:var(--display);font-weight:500;font-size:clamp(26px,7vw,32px);line-height:1.08;letter-spacing:-.025em;margin:26px 4px 18px;text-wrap:balance}
.headline em{font-style:normal;color:var(--muted)}
.notice{margin:0 0 14px;padding:10px 14px;border-radius:16px;background:var(--tile);color:var(--muted);font-size:13px;line-height:1.4}

/* board */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:linear-gradient(180deg,var(--tile-2),var(--tile));border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--rim),var(--shadow);padding:18px;min-width:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
.wide{grid-column:1/-1}
.label{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 6px 0;grid-column:1/-1}

/* hero rings */
.hero-top{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--warn);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.hero-top svg{width:14px;height:14px}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:8px 4px;margin-top:12px}
.ring{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ring .g{position:relative;width:54px;height:54px}
.ring svg.arc{width:54px;height:54px;display:block}
.ring .ic{position:absolute;inset:0;display:grid;place-items:center;color:color-mix(in oklab, var(--c), var(--ink) var(--icon-mix))}
.ring .ic svg{width:20px;height:20px}
.ring span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
.ring.on span{color:var(--ink)}

/* couple strip */
.duo-head{display:flex;align-items:flex-start;gap:8px}
.duo-side{min-width:0}
.duo-side small{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600}
.duo-side small i{width:8px;height:8px;border-radius:2px;display:inline-block}
.duo-side b{display:block;font-size:24px;font-weight:500;margin-top:2px}
.duo-side b sub{font-size:12px;color:var(--muted);font-family:var(--body);letter-spacing:0;vertical-align:baseline;margin-left:3px;font-weight:500}
.duo-side.r{margin-left:auto;text-align:right}
.duo-side.r small{justify-content:flex-end}
.faces{display:flex;margin:4px auto 0;padding:4px 8px;border-radius:99px;background:var(--track)}
.faces img{width:26px;height:26px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 2px var(--track)}
.faces img:first-child{margin-left:0}
.lanes{display:grid;grid-template-columns:repeat(14,1fr);gap:4px 3px;margin-top:16px}
.lane-cell{height:14px;border-radius:4px;background-color:var(--cell)}
.lanes-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-weight:600;margin-top:8px}

/* habit tile */
.h-head{display:flex;align-items:flex-start;gap:8px}
.h-title{min-width:0;flex:1;border:0;background:none;padding:0;text-align:left}
.h-title b{display:block;font-family:var(--display);font-size:clamp(18px,4.8vw,22px);font-weight:500;line-height:1.1;letter-spacing:-.015em;overflow-wrap:anywhere}
.tile:not(.wide) .h-title b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.solo{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);column-gap:8px;align-items:end}
.tile.solo .h-head{grid-column:1/-1;align-self:start}
.tile.solo .big{margin-bottom:4px}
.tile.solo .viz{margin:14px -18px 0 0}
.h-title small{display:block;margin-top:3px;color:var(--muted);font-size:12.5px}
.chip-btn{flex:none;height:30px;min-width:42px;padding:0 10px;border-radius:99px;border:0;background:var(--track);display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.chip-btn svg{width:16px;height:16px}
.chip-btn:active{transform:scale(.9)}
.chip-btn[aria-pressed="true"]{background:linear-gradient(90deg,var(--a),var(--b));color:#141016}
.chip-btn.txt{font-size:12px;font-weight:700}
.chip-btn.done{color:var(--ok)}
.big{display:flex;align-items:baseline;gap:4px;margin:14px 0 14px}
.big b{font-size:clamp(46px,13vw,60px);font-weight:500;line-height:.9}
.big span{color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.1}
.viz{margin:auto -18px 0;min-height:40px}
.axis{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis i{width:6px;height:6px;border-radius:50%;background:var(--ink)}
/* viz: goal segments */
.v-goal{display:grid;grid-template-columns:3fr 2fr 5fr;gap:4px;height:40px}
.v-goal div{border-radius:10px;background:var(--track);overflow:hidden;position:relative}
.v-goal div b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--a),var(--b))}
.v-goal div:first-child{border-radius:0 10px 10px 0}
.v-goal div:last-child{border-radius:10px 0 0 10px}
/* viz: thin bars */
.v-bars{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;height:40px}
.v-bars i{border-radius:2px;background:var(--b);opacity:.18}
.v-bars i.on{opacity:1}
.v-bars i.on:nth-child(3n){background:var(--a)}
/* viz: squares */
.v-sq{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:36px}
.v-sq i{border-radius:7px;background:var(--track)}
/* viz: week dots */
.v-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 14px;align-items:center;justify-items:center}
.v-dots i{width:100%;max-width:24px;aspect-ratio:1;border-radius:50%;background:var(--track);display:block}
.v-dots i.now{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.dot-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 14px;margin-top:8px;text-align:center;font-size:11.5px;color:var(--faint);font-weight:600}
.dot-labels .t{color:var(--ink)}
.pad-axis{padding:0 18px}
/* viz: ring */
.v-ring{position:relative;display:flex;justify-content:center;margin-bottom:-6px}
.v-ring svg.arc{width:104px;height:104px}
.v-ring div{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.v-ring div b{font-family:var(--display);font-size:22px;font-weight:500;line-height:1}
.v-ring div small{font-size:11px;color:var(--muted)}
/* viz: dot grid */
.v-grid{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;padding:0 18px}
.v-grid i{aspect-ratio:1;border-radius:3px;background:var(--track)}
.v-grid i.now{box-shadow:0 0 0 1.5px var(--ink)}
/* viz: streak wave */
.v-wave{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:3px;height:52px;align-items:end;padding:0 18px}
.v-wave i{border-radius:3px 3px 1px 1px;min-height:4px;background:var(--track)}
/* viz: beads */
.v-beads{display:flex;justify-content:center;align-items:center;height:52px}
.v-beads i{width:22px;height:22px;border-radius:50%;margin:0 -2px;flex:none;background:radial-gradient(circle at 35% 30%,var(--bead-hi),var(--bead-lo))}
.v-beads i.on{background:radial-gradient(circle at 35% 30%,var(--b),var(--a) 78%)}
.v-beads i.now{width:38px;height:38px;z-index:1;box-shadow:0 0 0 5px var(--halo),0 0 0 11px var(--halo)}
.v-beads i.now.on{box-shadow:0 0 0 5px var(--halo),0 0 0 11px var(--halo),0 0 22px var(--b)}
/* viz: month calendar */
.v-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:0 18px}
.v-month i{aspect-ratio:1;border-radius:5px;background:var(--track);font-style:normal;font-size:9px;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.v-month i.on{background:linear-gradient(135deg,var(--a),var(--b));color:#141016;font-weight:700}
.v-month i.blank{background:none}
.v-month i.later{opacity:.35}
.v-month i.now{box-shadow:0 0 0 1.5px var(--ink)}
/* viz: progress line */
.v-line{padding:0 18px}
.v-line .tr{height:6px;border-radius:99px;background:var(--track);position:relative;margin:18px 0 12px}
.v-line .tr b{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b))}
.v-line .tr i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--tile)}
.v-line .lr{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.v-line .lr b{color:var(--ink)}
/* viz: battery */
.v-batt{display:flex;gap:3px;height:42px;margin:0 18px;padding:4px;border-radius:15px;background:var(--track)}
.v-batt i{flex:1;border-radius:11px;background:var(--cell)}
.v-batt i.on{background:linear-gradient(180deg,var(--b),var(--a))}
/* layout switch */
.lay{grid-column:1/-1;display:flex;gap:2px;padding:4px;background:var(--tile);border-radius:99px;box-shadow:inset 0 0 0 1px var(--rim);justify-self:start;position:relative}
.lay button{border:0;background:none;border-radius:99px;padding:8px 13px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.lay button svg{width:16px;height:16px}
.lay button[aria-pressed="true"]{color:var(--bg)}
.lay-ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:99px;background:var(--ink);transition:transform .5s var(--spring),width .5s var(--spring)}
/* pattern rows */
.prow{padding:14px 14px 14px}
.p-head{display:flex;align-items:center;gap:10px}
.p-ic{width:22px;height:22px;flex:none;color:color-mix(in oklab, var(--b), var(--ink) var(--icon-mix))}
.p-ic svg{width:22px;height:22px}
.p-title{min-width:0;flex:1;border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.p-meta span{display:inline-flex;align-items:center;gap:3px}
.p-meta svg{width:13px;height:13px;color:var(--warn)}
.p-months{display:grid;gap:3px;margin:12px 0 5px;font-size:10.5px;color:var(--muted);font-weight:600;height:13px}
.p-months span{white-space:nowrap;overflow:visible}
.p-heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.p-heat i{aspect-ratio:1;border-radius:3px;background:var(--cell)}
.p-heat i.future{background:transparent}
.p-heat i.now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.enter .p-heat > i{animation:popin .45s var(--spring) both;animation-delay:calc(var(--i,0)*55ms + 100ms + var(--j,0)*16ms)}
/* week rows */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--faint)}
.wk div.t{color:var(--ink)}
.wk i{width:100%;max-width:34px;aspect-ratio:1;border-radius:11px;background:var(--cell)}
.wk i.on{background:linear-gradient(135deg,var(--a),var(--b))}
.wk i.half{background:var(--a);opacity:.4}
.wk i.future{background:transparent;box-shadow:inset 0 0 0 1px var(--cell)}
.wk div.t i{box-shadow:0 0 0 2px var(--tile),0 0 0 3.5px var(--ink)}
.enter .wk > div{animation:popin .45s var(--spring) both;animation-delay:calc(var(--i,0)*55ms + 100ms + var(--j,0)*30ms)}
/* square grids: size rows from the container width (Safari ignores aspect-ratio when sizing grid rows) */
.viz,.prow,#d-panel,.mini-m{container-type:inline-size}
.v-month{grid-auto-rows:calc((100cqw - 54px) / 7)}
.v-month.cal{grid-auto-rows:calc((100cqw - 30px) / 7)}
.v-month i,.mini-m div i,.v-grid i,.p-heat i{aspect-ratio:auto;min-height:0}
.mini-m div{grid-auto-rows:calc((100cqw - 12px) / 7)}
.v-grid{grid-auto-rows:calc((100cqw - 78px) / 15)}
.v-dots i{aspect-ratio:auto;width:min(24px, calc((100cqw - 52px) / 7));height:min(24px, calc((100cqw - 52px) / 7))}
.wk i{aspect-ratio:auto;width:min(34px, calc((100cqw - 36px) / 7));height:min(34px, calc((100cqw - 36px) / 7))}
/* step habits */
.steps{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:5px;margin-top:14px}
.step{border:0;border-radius:12px;padding:10px 2px;background:var(--track);color:var(--muted);font-weight:600;font-size:12.5px;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .25s var(--spring),background .25s,color .25s}
.step:not(:disabled):active{transform:scale(.92)}
.step.on{background:linear-gradient(135deg,var(--a),var(--b));color:#141016}
.step:disabled{cursor:default}
.steps.compact{display:flex;gap:4px;margin:0;flex:none}
.steps.compact .step{width:26px;height:26px;padding:0;border-radius:50%;font-size:11px;display:grid;place-items:center}
.tile.wide > .steps{margin-bottom:2px}
.spick{margin-top:16px;padding:14px;border-radius:18px;background:var(--track)}
.spick .steps{margin-top:8px}
.spick .step{background:var(--tile)}
.spick .step.on{background:linear-gradient(135deg,var(--a),var(--b))}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.v-month.cal i.picked{box-shadow:0 0 0 2px var(--tile),0 0 0 3.5px var(--b)}
.sstats{margin-top:20px;display:grid;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,72px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}

.enter .v-sgrid > i{animation:popin .4s var(--spring) both;animation-delay:calc(var(--i,0)*55ms + 120ms + var(--j,0)*14ms)}

.cu-rest{border:0;background:none;padding:0;margin-top:12px;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.wk div.tap{cursor:pointer}

:is(.p-heat,.wk,.v-month,.mini-m div) i.rest{background:repeating-linear-gradient(135deg,var(--cell) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--cell)}
.v-month i.half{background:var(--a);opacity:.5;color:#141016}
.v-month.tappable i[role="button"]{cursor:pointer;transition:transform .2s var(--spring)}
.v-month.tappable i[role="button"]:active{transform:scale(.88)}
.tap-tools{margin-top:16px}
.tap-tools .hint{margin:10px 2px 0}
/* history sheet */
.dstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0 18px}
.dstat{background:var(--track);border-radius:16px;padding:12px 14px;min-width:0}
.dstat b{display:block;font-family:var(--display);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.dstat b small{font-size:13px;color:var(--muted);font-family:var(--body);margin-left:3px}
.dstat span{display:block;margin-top:4px;font-size:12px;color:var(--muted)}

.dnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px}
.dnav b{font-weight:600;font-size:16px}
.dnav button{width:38px;height:38px;border-radius:50%;border:0;background:var(--track);font-size:18px}
.dnav button:disabled{opacity:.3;cursor:default}
.v-month.cal{padding:0;gap:5px}
.v-month.cal i{font-size:12px;border-radius:9px}
.dfoot{color:var(--muted);font-size:13px;margin-top:12px;line-height:1.4}

.ybars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:96px;align-items:end}

/* week chart */
.uv-head{display:flex;align-items:baseline;gap:8px}

.uv{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:120px;align-items:end;margin-top:14px;position:relative}
.uv i{border-radius:4px 4px 2px 2px;min-height:6px;background:var(--track)}
.uv-axis{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px;font-size:10.5px;color:var(--faint);text-align:center;font-weight:600}
.uv-axis .t{color:var(--ink)}
.stat b{font-size:40px;font-weight:500;line-height:1}
.stat span{display:block;margin-top:6px;color:var(--muted);font-size:13px;line-height:1.3}

.beads{display:flex;justify-content:center;align-items:center;gap:0;margin:22px -18px 6px;position:relative}

.bead-n{text-align:center;font-size:28px;font-weight:600;margin-top:4px}
.jar-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.jar-foot div{min-width:0;flex:1}
.jar-foot b{display:block;font-size:16px;overflow-wrap:anywhere}
.jar-foot small{color:var(--muted);font-variant-numeric:tabular-nums}

/* people */
.gauge{position:relative;width:120px;height:120px;margin:6px auto 0}
.gauge svg{width:120px;height:120px;display:block}
.gauge img{position:absolute;inset:26px;width:68px;height:68px;border-radius:50%}
.gauge-v{text-align:center;margin-top:-6px}
.gauge-v b{font-size:28px;font-weight:500}
.gauge-v b sub{font-size:13px;color:var(--muted);vertical-align:baseline;font-family:var(--body);margin-left:2px}
.person-name{text-align:center;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-top:2px}

.btn{border:0;border-radius:99px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--track);color:var(--ink)}
.btn.danger{background:none;color:var(--danger);box-shadow:inset 0 0 0 1.5px currentColor}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-inner{pointer-events:auto;display:flex;gap:6px;padding:7px;border-radius:99px;background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--rim),var(--navshadow)}
.nav button{width:54px;height:54px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--tile);border-radius:30px 30px 0 0;box-shadow:inset 0 1px 0 var(--rim);padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;touch-action:pan-y}

.sheet h3{margin:0 0 16px;font-family:var(--display);font-weight:500;font-size:24px}
.field{display:grid;gap:8px;margin-bottom:16px}
.field label,.field .lbl{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;padding:14px 16px;border-radius:16px;border:0;background:var(--track);color:var(--ink);font:inherit;font-size:17px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--track)}
.seg button{border:0;background:none;border-radius:12px;padding:10px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 16px;line-height:1.4}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--track);border:0;width:100%;text-align:left}
.row i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
.row div{min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted)}
.row img{width:40px;height:40px;border-radius:50%}

.loading{color:var(--muted);margin-top:30px}

/* ---------- motion ---------- */
:root{--spring:cubic-bezier(.2,.9,.25,1.08);--ease:cubic-bezier(.2,.8,.2,1)}
.tile{transition:transform .35s var(--spring), box-shadow .35s}
.tile:has(.h-title:active){transform:scale(.985)}
.board.enter > *{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}

.enter .val{animation:draw 1.1s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 150ms)}

@keyframes draw{from{stroke-dasharray:0 999}}
.enter :is(.v-bars,.v-wave,.uv,.ybars) > i{transform-origin:bottom;animation:grow .7s var(--spring) both;animation-delay:calc(var(--i,0)*55ms + 120ms + var(--j,0)*22ms)}

@keyframes popin{from{opacity:0;transform:scale(.4)}}
.enter .v-goal b,.enter .v-line .tr b{animation:fillw 1s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 200ms)}

.enter .v-line .tr i{animation:slide 1s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 200ms)}
@keyframes slide{from{left:0}}
.enter .lane-cell{animation:popin .45s var(--spring) both;animation-delay:calc(var(--i,0)*55ms + 120ms + var(--j,0)*10ms)}
.ring .g{transition:transform .3s var(--spring)}
.ring:active .g{transform:scale(.88)}
.ring.pop .g{animation:pop .6s var(--spring)}
.pop .chip-btn[aria-pressed="true"]{animation:pop .55s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tile.pop{animation:glow 1s var(--ease)}
@keyframes glow{0%{box-shadow:inset 0 0 0 1px var(--rim),0 0 0 0 color-mix(in oklab,var(--b) 60%,transparent)}40%{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--b) 70%,transparent),0 0 34px -6px color-mix(in oklab,var(--b) 55%,transparent)}100%{box-shadow:inset 0 0 0 1px var(--rim),0 0 0 0 transparent}}
.bead.cur{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 13px var(--halo),0 0 0 26px var(--halo),0 0 42px rgba(245,182,42,.65)}}
.chip-btn,.btn,.chip,.look,.sw,.round,.seg button{transition:transform .25s var(--spring),background .25s,color .25s,box-shadow .25s}
:is(.btn,.chip,.look,.sw,.round):active{transform:scale(.94)}
/* nav indicator */
.nav-inner{position:relative}
.nav-ind{position:absolute;top:7px;left:0;width:54px;height:54px;border-radius:50%;background:var(--ink);transition:transform .55s var(--spring);pointer-events:none}
.nav button{position:relative;z-index:1;transition:color .3s}
.nav button[aria-current="page"]{background:transparent!important;color:var(--bg)}
/* sheets */
.scrim{animation:fade .3s ease both}
.scrim .sheet{animation:sheetup .5s var(--spring) both}
.scrim.closing{animation:fade .28s ease reverse both}
.scrim.closing .sheet{animation:sheetdown .28s cubic-bezier(.4,0,.8,.4) both}
@keyframes fade{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes sheetdown{to{transform:translateY(105%)}}
.sheet.dragging{transition:none;animation:none}
.sheet.settle{transition:transform .4s var(--spring)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--faint);margin:-8px auto 14px}
.swap-in{animation:swapin .35s var(--ease) both}
@keyframes swapin{from{opacity:0;transform:translateY(10px)}}

</style>

<script type="module">
(() => {
const SV = (d, w=1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  flame: SV('<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.5 1 2.5 2 3 0-3 0-5.5 1-8.5Z"/>',2),
  tick: SV('<path d="m5 12.5 4.5 4.5L19 7.5"/>',2.6),

function dragToClose(sh){
  let y0 = null, dy = 0, t0 = 0;
  sh.addEventListener("pointerdown", e => {
    if (sh.scrollTop > 0 || e.target.closest("input,button") && !e.target.closest(".grab")) return;
    y0 = e.clientY; dy = 0; t0 = performance.now();
  });
  window.addEventListener("pointermove", e => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0);
    if (dy > 4){ sh.classList.add("dragging"); sh.classList.remove("settle"); sh.style.transform = `translateY(${dy}px)`; }
  });
  const end = () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, performance.now() - t0);
    y0 = null; sh.classList.remove("dragging");
    if (dy > 110 || (dy > 30 && v > .6)) { closeSheet(); return; }
    sh.classList.add("settle"); sh.style.transform = "";
  };
  window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
}

function stepPatterns(h, yr, first){
  const st = stepsOf(h), firstK = keyOf(first), out = [];
  const byM = st.map(() => Array(12).fill(null)), byW = st.map(() => Array(7).fill(0)), wDays = Array(7).fill(0);
  for (let mo = 0; mo < 12; mo++){
    const dim = new Date(yr, mo+1, 0).getDate(); let n = 0; const c = st.map(() => 0);
    for (let d = 1; d <= dim; d++){
      const dt = new Date(yr, mo, d, 12), k = keyOf(dt);
      if (k > today() || k < firstK || isRest(h, k)) continue;
      n++; const a = stepArr(S.me, h.id, k); a.forEach(i => c[i]++);
      const w = (dt.getDay() + 6) % 7; wDays[w]++; a.forEach(i => byW[i][w]++);
    }
    if (n) st.forEach((_, i) => byM[i][mo] = c[i] / n);
  }
  if (byM[0].some(v => v !== null)) out.push(heatTable(`By month · ${yr}`, st, MONTHS.map(m => m[0]), byM, {}));
  const wVals = st.map((_, i) => byW[i].map((v, w) => wDays[w] ? v / wDays[w] : null));
  if (wDays.some(Boolean)){
    let worst = null, wv = 2;
    st.forEach((name, i) => wVals[i].forEach((v, w) => { if (v !== null && wDays[w] >= 3 && v < wv){ wv = v; worst = `${name} on ${["Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays","Sundays"][w]}`; } }));

function queue(fn){ writing = writing.then(fn).catch(e => { console.warn(e); toast(e?.code === "permission-denied" || e?.code === "permission_denied" ? "You don't have access to this board." : "Couldn't save. Check your connection."); }); return writing; }
// every change to my own record goes through here: one doc per person, only I write it
function saveMine(mutate){
  const next = structuredClone(S.progress[S.me] || {});
  next.days = next.days || {};
  mutate(next);
  const cutoff = keyOf(daysAgo(731));
  Object.values(next.days).forEach(m => Object.keys(m).forEach(k => { if (k < cutoff) delete m[k]; }));
  if (next.rest) Object.keys(next.rest).forEach(k => { if (k < cutoff) delete next.rest[k]; });
  next.joinedAt = next.joinedAt || Date.now();
  if (!S.demo){ next.name = S.meInfo?.name || ""; next.photo = S.meInfo?.photo || ""; }
  S.progress = {...S.progress, [S.me]: next};
  if (!S.demo) queue(() => store.doc("progress/"+S.me).set(next));
}
function toggleDay(hid, k){
  let nowOn = false;
  saveMine(n => {
    const m = n.days[hid] = n.days[hid] || {}, st = stepsOf(HB[hid]);
    const full = st ? (m[k] === true || (Array.isArray(m[k]) && m[k].length >= st.length)) : !!m[k];
    if (full) delete m[k]; else { m[k] = st ? st.map((_, i) => i) : true; nowOn = true; }
  });
  if (nowOn && k === today()) popId = hid;
  render();
}
function toggle(hid){ toggleDay(hid, today()); }
function toggleStep(hid, k, i){
  const st = stepsOf(HB[hid]); if (!st) return toggleDay(hid, k);
  let full = false;
  saveMine(n => {
    const m = n.days[hid] = n.days[hid] || {};
    let a = m[k] === true ? st.map((_, j) => j) : Array.isArray(m[k]) ? m[k].filter(j => j < st.length) : [];
    a = a.includes(i) ? a.filter(j => j !== i) : [...a, i].sort((x, y) => x - y);
    if (a.length) m[k] = a; else delete m[k];
    full = a.length >= st.length;
  });
  if (full && k === today()) popId = hid;
  render();
}
function toggleRest(k){ saveMine(n => { n.rest = n.rest || {}; if (n.rest[k]) delete n.rest[k]; else n.rest[k] = true; }); render(); }
function setDayEnd(v){ saveMine(n => { n.dayEnd = v; }); render(); }
function addHabit(title, owner, goal, freq, extra = {}){
  const h = {title, owner, goal, perWeek: freq || 7, ...extra, createdAt: Date.now(), createdBy: S.me};
  if (S.demo){ S.allHabits = [...S.allHabits, {...h, id:"d"+Math.random().toString(36).slice(2)}]; syncActive(); render(); return; }
  queue(() => store.collection("habits").add(h));
}
function updateHabit(id, patch){
  if (S.demo){ S.allHabits = S.allHabits.map(h => h.id===id ? {...h, ...patch} : h); syncActive(); render(); return; }
  queue(() => store.doc("habits/"+id).update(patch));
}
function removeHabit(id){
  if (S.demo){ S.allHabits = S.allHabits.filter(h => h.id !== id); syncActive(); render(); return; }
  queue(() => store.doc("habits/"+id).delete());
}
async function sendNudge(h){
  if (!S.demo) await queue(() => store.doc("nudges/"+h.owner).set({from:S.me, habit:h.id, at:Date.now(), seen:false}));
  toast(`Nudge sent to ${nameOf(h.owner)}`);
}
function ackNudge(){ S.nudge = {...S.nudge, seen:true}; render(); if (!S.demo) queue(() => store.doc("nudges/"+S.me).update({seen:true})); }
function saveJar(j){ S.jar = j; render(); if (!S.demo) queue(() => store.doc("settings/jar").set(j)); }

let resolving = false;
async function resolveProfiles(){
  if (!user || resolving) return;
  const ids = [...new Set([...members(), S.nudge?.from].filter(Boolean))];
  if (!ids.filter(id => !S.profiles[id]).length) return;
  resolving = true;
  try { const ps = await user.profiles(ids); S.profiles = {...S.profiles, ...ps}; } finally { resolving = false; }
  render();
}

document.querySelectorAll(".nav button").forEach(b => b.onclick = () => {
  if (b.dataset.view === "add") return openAdd();
  if (S.view === b.dataset.view) return;
  S.view = b.dataset.view; closeSheet(); animMode = "enter"; window.scrollTo({top:0}); render();
});
document.querySelector(".nav-inner").prepend(el(`<span class="nav-ind" aria-hidden="true"></span>`));
let rsz; window.addEventListener("resize", () => { moveNav(); clearTimeout(rsz); rsz = setTimeout(() => { if (S.layout === "year" && S.view === "today") render(); }, 200); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// ---------- demo data (only when no shared store is available) ----------
function initials(ch, color){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="${color}"/><text x="20" y="26" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">${ch}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function startDemo(){
  S.demo = true; S.me = "demo-me"; S.meInfo = {name:"You", avatarUrl: initials("Y","#7c3aed")};
  S.profiles = {"demo-me":{name:"You", avatarUrl: initials("Y","#7c3aed")}, "demo-partner":{name:"Partner", avatarUrl: initials("P","#2563eb")}};
  S.allHabits = [
    {id:"h9", title:"Guitar practice", owner:"demo-me", goal:0, pauses:[{from: keyOf(daysAgo(10))}]},
    {id:"h1", title:"Read 20 pages", owner:"demo-me", goal:0},
    {id:"h2", title:"Exercise 45 minutes", owner:"demo-me", goal:50, perWeek:3},
    {id:"h5", title:"Drink 2L of water", owner:"demo-me", goal:30, viz:"wave", color:5},
    {id:"h8", title:"Journal", owner:"demo-me", goal:60, viz:"month", color:4},
    {id:"h6", title:"Sleep by 11", owner:"demo-me", goal:60, viz:"ring", color:3},
    {id:"h3", title:"Evening walk together", owner:US, goal:60},
    {id:"hp", title:"Pray at the mosque", owner:"demo-me", goal:0, steps:["Fajr","Dhuhr","Asr","Maghrib","Isha"], color:1},
    {id:"h4", title:"Learn 10 new words", owner:"demo-partner", goal:30},
    {id:"h7", title:"Yoga", owner:"demo-partner", goal:60, perWeek:3, viz:"battery", color:3}
  ];
  const fill = (rate, seed, skipToday) => { const m = {}; for (let i = skipToday?1:0; i < 300; i++){ seed = (seed*9301+49297)%233280; if (i < 5 || seed/233280 < rate) m[keyOf(daysAgo(i))] = true; } return m; };
  S.progress = {
    "demo-me": {days:{h1:fill(.55,7,true), h2:fill(.4,3,false), h3:fill(.6,11,false), h5:fill(.7,13,false), h6:fill(.5,17,true), h8:fill(.6,23,false)}},
    "demo-partner": {days:{h3:fill(.65,5,false), h4:fill(.5,9,true), h7:fill(.4,21,false)}}
  };
  S.jar = {goal:100, reward:"Weekend brunch", since: keyOf(daysAgo(14))};
  { const m = {}; let seed = 31; for (let i = 0; i < 120; i++){ const a = []; for (let j = 0; j < 5; j++){ seed = (seed*9301+49297)%233280; if (seed/233280 < [.55,.9,.85,.95,.8][j]) a.push(j); } if (i === 0) a.splice(2); if (a.length) m[keyOf(daysAgo(i))] = a; } S.progress["demo-me"].days.hp = m; }
  ["h6","h8"].forEach(id => delete S.progress["demo-me"].days[id][keyOf(daysAgo(1))]);
  S.progress["demo-me"].rest = {[keyOf(daysAgo(3))]: true, [keyOf(daysAgo(17))]: true};
  syncActive();
  S.ready = {habits:true, progress:true};
  render();
}

// ---------- boot (Firebase) ----------
const FB_VERSION = "10.12.2";
let FB = null;
const GOOGLE_ICON = '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8Z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.7H2.1v2.8A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.7 14a6.6 6.6 0 0 1 0-4.2V7H2.1a11 11 0 0 0 0 9.8L5.7 14Z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4Z"/></svg>';
function gate(html){
  document.querySelector(".nav").hidden = true;
  const app = document.getElementById("app");
  app.innerHTML = `<section class="gate"><div class="mark" aria-hidden="true">${[1,0,1,1,1,0,0,1,1].map(o => `<i class="${o?'on':''}"></i>`).join("")}</div>${html}</section>`;
  return app.querySelector(".gate");
}
function joinParam(){ return new URLSearchParams(location.search).get("join"); }
function clearJoinParam(){ history.replaceState(null, "", location.pathname); }
function showSignIn(err){
  const inviting = !!joinParam();
  const g = gate(`<h1>${inviting ? "You're invited. <em>Let's build habits together.</em>" : "Two of Us. <em>Habits, together.</em>"}</h1>
    <p>${inviting ? "Sign in to join the shared habit board." : "Track your habits, keep shared streaks with your partner, and nudge each other along."}</p>
    <div class="btn-row"><button class="btn" id="g-in" type="button">${GOOGLE_ICON}<span>Continue with Google</span></button></div>
    <p class="err" id="g-err"></p>`);
  if (err) g.querySelector("#g-err").textContent = err;
  g.querySelector("#g-in").onclick = async () => {
    const provider = new FB.A.GoogleAuthProvider();
    try { await FB.A.signInWithPopup(FB.auth, provider); }
    catch (e) {
      if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) return FB.A.signInWithRedirect(FB.auth, provider);
      if (e.code !== "auth/popup-closed-by-user") g.querySelector("#g-err").textContent = "Sign-in didn't work. Please try again.";
    }
  };
}
function askSwitch(){
  return new Promise(resolve => {
    const g = gate(`<h1>Join this board? <em>You already have one.</em></h1>
      <p>Joining moves you to the shared board from your invite. Your current board stays where it is, but you won't see it unless you sign in to it again later.</p>
      <div class="btn-row"><button class="btn" id="j-yes" type="button">Join the shared board</button><button class="btn ghost" id="j-no" type="button">Keep my current board</button></div>`);
    g.querySelector("#j-yes").onclick = () => resolve(true);
    g.querySelector("#j-no").onclick = () => resolve(false);
  });
}
// a tiny adapter so the app talks to Firestore with the same calls it used before
function shim(prefix){
  const {F, db} = FB;
  const wrapDoc = s => ({id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata});
  return {
    doc: p => { const ref = F.doc(db, prefix + p); return {
      set: d => F.setDoc(ref, d), update: d => F.updateDoc(ref, d), delete: () => F.deleteDoc(ref),
      onSnapshot: (n, e) => F.onSnapshot(ref, s => n(wrapDoc(s)), e) }; },
    collection: p => { const col = F.collection(db, prefix + p);
      const mk = q => ({
        orderBy: (f, dir) => mk(F.query(col, F.orderBy(f, dir || "asc"))),
        add: d => F.addDoc(col, d),
        onSnapshot: (n, e) => F.onSnapshot(q, s => n({docs: s.docs.map(wrapDoc), metadata: s.metadata, empty: s.empty, size: s.size}), e) });
      return mk(col); }
  };
}
async function enterHousehold(u){
  const {F, db} = FB;
  S.me = u.uid;
  const first = (u.displayName || u.email || "?").trim();
  S.meInfo = {name: u.displayName || (u.email || "").split("@")[0], photo: u.photoURL || "", avatarUrl: u.photoURL || initials(first[0].toUpperCase(), "#7c3aed")};
  document.getElementById("app").innerHTML = '<p class="loading">Loading your habits…</p>';
  const uref = F.doc(db, "users", u.uid);
  let hid = null;
  try { const us = await F.getDoc(uref); hid = us.exists() ? us.data().household : null; } catch (e) { console.warn(e); }
  const join = joinParam();
  if (join && join !== hid){
    if (!hid || await askSwitch()){
      try {
        await F.updateDoc(F.doc(db, "households", join), {members: F.arrayUnion(u.uid)});
        await F.setDoc(uref, {household: join});
        hid = join; toast("You've joined the shared board");
      } catch (e) {
        console.warn(e); clearJoinParam();
        if (!hid) return showSignInError("This invite link isn't valid, or that board already has two people. Ask for a new link.");
      }
    }
    clearJoinParam();
  } else if (join) clearJoinParam();
  if (!hid){
    const ref = await F.addDoc(F.collection(db, "households"), {members: [u.uid], owner: u.uid, createdAt: Date.now()});
    hid = ref.id; await F.setDoc(uref, {household: hid});
  }
  S.hid = hid;
  store = shim(`households/${hid}/`);
  document.querySelector(".nav").hidden = false;
  subscribe();
}
function showSignInError(msg){
  const g = gate(`<h1>That link didn't work.</h1><p></p><div class="btn-row"><button class="btn" type="button" id="g-home">Go to my board</button><button class="btn ghost" type="button" id="g-out">Sign out</button></div>`);
  g.querySelector("p").textContent = msg;
  g.querySelector("#g-home").onclick = () => location.replace(location.pathname);
  g.querySelector("#g-out").onclick = async () => { await FB.A.signOut(FB.auth); location.replace(location.pathname); };
}
function profileFrom(id, d){
  const nm = d?.name || "";
  return {name: nm, avatarUrl: d?.photo || initials((nm || "?")[0].toUpperCase(), id === S.me ? "#7c3aed" : "#2563eb")};
}
let joined = false;
function subscribe(){
  const timer = setTimeout(() => { if (!S.ready.habits || !S.ready.progress) document.getElementById("app").innerHTML = '<p class="loading">Still connecting. The board will appear as soon as it loads.</p>'; }, 10000);
  const fail = e => { clearTimeout(timer); console.warn(e); document.getElementById("app").innerHTML = '<p class="loading">Couldn\'t load the board. Check your connection and reload.</p>'; };
  store.collection("habits").orderBy("createdAt").onSnapshot(snap => { S.allHabits = snap.docs.map(d => ({id:d.id, ...d.data()})); syncActive(); S.ready.habits = true; clearTimeout(timer); render(); }, fail);
  store.collection("progress").onSnapshot(snap => {
    const p = {}; snap.docs.forEach(d => p[d.id] = d.data());
    const mine = p[S.me];
    const needsWrite = !snap.metadata.fromCache && (!mine || mine.name !== S.meInfo.name || (mine.photo || "") !== S.meInfo.photo);
    if (!p[S.me]) p[S.me] = {days:{}};
    S.progress = p;
    const prof = {}; Object.keys(p).forEach(id => prof[id] = profileFrom(id, id === S.me ? {name: S.meInfo.name, photo: S.meInfo.photo} : p[id]));
    S.profiles = prof;
    S.ready.progress = true; render();
    if (needsWrite && !joined){ joined = true; saveMine(() => {}); }
  }, fail);
  store.doc("nudges/"+S.me).onSnapshot(s => { S.nudge = s.exists ? s.data() : null; if (S.ready.habits) render(); }, () => {});
  store.doc("settings/jar").onSnapshot(s => { S.jar = s.exists ? s.data() : null; if (S.ready.habits) render(); }, () => {});
}
async function boot(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /^YOUR/i.test(cfg.apiKey)){ startDemo(); return; }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [App, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const app = App.initializeApp(cfg);
    const auth = A.getAuth(app);
    let db; try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); } catch { db = F.getFirestore(app); }
    FB = {A, F, auth, db};
    A.getRedirectResult(auth).catch(e => console.warn(e));
    A.onAuthStateChanged(auth, u => { if (u) enterHousehold(u).catch(e => { console.warn(e); showSignIn("Couldn't open your board. Check your connection and try again."); }); else showSignIn(); });
  } catch (e) {
    console.warn(e);
    document.getElementById("app").innerHTML = '<p class="loading">Couldn\'t reach the server. Check your connection and reload.</p>';
  }
}
function getMode(){ try { return localStorage.getItem("mode") || "auto"; } catch { return "auto"; } }
function setMode(m){
  try { localStorage.setItem("mode", m); } catch {}
  if (m === "auto") delete document.documentElement.dataset.mode; else document.documentElement.dataset.mode = m;
}
setMode(getMode());
// keep "today" right if the app stays open past midnight or comes back from the background
let lastDay = null;
function dayTick(){ const t = today(); if (lastDay && t !== lastDay && S.ready.habits && S.ready.progress) render(); lastDay = t; }
setInterval(dayTick, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) dayTick(); });
boot();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
